<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>视频课堂 · 课程知识平台</title>
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<header class="topbar">
  <div>
    <div class="brand">视频课堂</div>
    <div class="brand-sub" id="v-meta">加载中…</div>
  </div>
  <nav class="nav-links">
    <a class="nav-link" href="index.html">知识库</a>
    <a class="nav-link" href="graph.html">知识图谱</a>
    <a class="nav-link active" href="video.html">视频课堂</a>
    <a class="nav-link" href="chat.html">AI 助教</a>
  </nav>
  <select id="v-doc" title="选择视频文档"></select>
  <div class="caps" id="caps"></div>
  <a class="nav-link" id="v-sub-link" href="#" target="_blank" rel="noopener">VTT</a>
  <a class="nav-link" id="v-srt-link" href="#" target="_blank" rel="noopener">SRT</a>
  <button id="btn-reparse" type="button" title="重跑 ASR / 字幕 / 文稿 / 思维导图">生成字幕 / 重跑</button>
  <button id="btn-slides" type="button" title="用 ffmpeg 场景检测抽帧">抽取幻灯片帧</button>
</header>

<div class="v-layout">
  <div class="v-left">
    <div class="v-player-wrap">
      <video id="v-player" controls preload="metadata"></video>
    </div>
    <div class="v-under">
      <span class="v-clock" id="v-clock">00:00</span>
      <span class="faint">/</span>
      <span class="mono faint" id="v-duration">—</span>
      <span class="pill" id="v-chapter-now">—</span>
      <span class="small faint">当前字幕 <b class="mono" id="v-active-seg">—</b></span>
      <span class="right"></span>
      <button id="btn-sub-autofollow" type="button">自动跟随：开</button>
      <span class="small muted" id="v-status">等待视频产物…</span>
      <span class="small muted mono" id="v-task" data-task-id="" data-done=""></span>
    </div>
    <div class="small mono faint" id="v-media-check" style="padding:0 14px 6px">媒体：等待加载</div>
    <div class="note info hidden" id="v-simclock-note">
      合成时钟模式（<code>?simclock=1</code>）：用于<b>无媒体/无头环境</b>验证字幕同步与跳转链路。
      真实播放路径不受影响，只是把取时间的地方换成合成值；每次 seek 都记进 <code>#v-seeklog</code>。
    </div>
    <div class="note bad hidden" id="asr-note"></div>
    <div class="note warn hidden" id="ffmpeg-note"></div>
    <div class="note warn hidden" id="subs-empty-note"></div>
  </div>

  <div class="v-right">
    <div class="tabs">
      <div class="tab active" data-tab="subs">字幕 <span class="faint mono tiny" id="v-sub-badge">0</span></div>
      <div class="tab" data-tab="transcript">文稿 <span class="faint mono tiny" id="v-ch-badge"></span></div>
      <div class="tab" data-tab="mindmap">思维导图 <span class="faint mono tiny" id="v-mm-count">0</span></div>
      <div class="tab" data-tab="slides">幻灯片帧 <span class="faint mono tiny" id="v-sl-badge"></span></div>
    </div>

    <div class="tabpane" data-pane="subs">
      <div class="small muted" style="margin-bottom:6px">
        <span id="v-sub-count">0 条字幕</span> · 点任意一条跳到该时间点；<b>虚拟滚动</b>（只渲染可视窗口的行，长文稿几千条也不卡）
      </div>
      <div class="sub-list" id="v-subs"></div>
    </div>

    <div class="tabpane hidden" data-pane="transcript">
      <div id="v-transcript"></div>
    </div>

    <div class="tabpane hidden" data-pane="mindmap">
      <div class="small muted" style="margin-bottom:6px">
        markmap 兼容 Markdown → 可折叠树
        <button id="btn-mm-expand" type="button">全部展开</button>
        <button id="btn-mm-collapse" type="button">全部折叠</button>
      </div>
      <div id="v-mindmap" class="panel" style="padding:12px 14px"></div>
    </div>

    <div class="tabpane hidden" data-pane="slides">
      <div id="v-slides"></div>
    </div>
  </div>
</div>

<div id="v-seeklog" class="report-json" data-count="0" data-last="0"></div>
<div class="gc-bar"><span class="small faint" id="v-selftest"></span></div>

<script type="module" src="assets/video-page.js"></script>
</body>
</html>
